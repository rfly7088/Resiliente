<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8FC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Résiliente">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Résiliente — Your cracks are part of your gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================
   RÉSILIENTE — Design system
   Soft lavender + blush, serif headings, generous space
   ===================================================== */
:root{
  --bg:#FBF8FC; --card:#FFFFFF; --ink:#1C1B1F; --muted:#7A7385; --faint:#BDB5C8; --line:#ECE6F2;
  --p1:#C9B6E4; --p2:#B39DDB; --k1:#F8C8DC; --k2:#F4B6C9; --deep:#5B3F8C; --soft:#F4EEF9;
  --mint:#CBEBDD; --peach:#FBD9C4; --sky:#CFE4F6; --gold:#D9B77A;
  --navbg:rgba(255,255,255,.88);
  --shadow:0 12px 32px -14px rgba(91,63,140,.20),0 2px 6px rgba(91,63,140,.05);
  --r:24px;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --dk1:#1C1B1F; --dk2:#3A2F45;
}
[data-theme=dark]{
  --bg:#17151B; --card:#221F29; --ink:#F1ECF6; --muted:#A59DB2; --faint:#5B5568; --line:#332E3C;
  --soft:#2B2634; --deep:#CDBBEF; --navbg:rgba(34,31,41,.9);
  --shadow:0 12px 32px -14px rgba(0,0,0,.65);
  --dk1:#2B2634; --dk2:#4C3C5F;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;transition:background .4s,color .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.ic{display:block;flex:none}
.app{max-width:760px;margin:0 auto;padding:22px 18px 160px}
.enter{animation:enter .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Header ---------- */
.hdr{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--p2),var(--k2));color:#fff;
  font-family:var(--serif);font-size:21px;font-weight:600;flex:none;box-shadow:0 8px 18px -8px rgba(179,157,219,.9)}
.hmid{flex:1;min-width:0}
.hmid h1{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.08;letter-spacing:-.2px}
.hmid h1 em{font-style:italic;color:var(--deep)}
.hmid p{font-size:12.5px;color:var(--muted);margin-top:3px}
.saved{font-size:11.5px;padding:6px 12px;border-radius:99px;background:var(--soft);color:var(--deep);white-space:nowrap;transition:all .5s}
.saved.pulse{background:var(--k1);color:#7a3355;transform:scale(1.06)}

/* ---------- Chips / pills ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{font-size:12px;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-weight:500}
button.chip{cursor:pointer;transition:.2s}
button.chip.on{background:var(--p1);border-color:var(--p1);color:#2b1d44}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.fchips::-webkit-scrollbar{display:none}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:18px;border:1px solid transparent}
[data-theme=dark] .card{border-color:var(--line)}
.eyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card h2{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.15;margin:4px 0 12px}
.card h3{font-family:var(--serif);font-weight:500;font-size:20px;margin-bottom:6px}
.sub{font-size:13px;color:var(--muted)}
.card.dark{background:linear-gradient(145deg,var(--dk1),var(--dk2));color:#F6F1FA;border-color:transparent}
.card.dark .eyebrow{color:#CDB9E8}
.card.dark h2{font-size:31px;color:#fff;margin:8px 0 6px}
.card.dark .sub{color:#CFC6DA}
.card.dark .bar{background:rgba(255,255,255,.14)}
.card.dark .bar i{background:var(--k2)}
.card.gold{background:linear-gradient(140deg,#FFF9EE,#FBEFF5);}
[data-theme=dark] .card.gold{background:linear-gradient(140deg,#2d2630,#2a2533)}
.quote{font-family:var(--serif);font-size:24px;line-height:1.3;font-weight:500;font-style:italic}
.qauth{font-size:12.5px;color:var(--muted);margin-top:10px;letter-spacing:.02em}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 12px}
.sec h3{font-family:var(--serif);font-size:23px;font-weight:500}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:18px 10px}
.empty b{display:block;font-family:var(--serif);font-size:20px;font-weight:500;color:var(--ink);margin-bottom:4px}
.note-small{font-size:12px;color:var(--muted);text-align:center;margin:18px 10px;font-style:italic}

/* ---------- Bars / rings ---------- */
.bar{height:7px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--p2),var(--k2));transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ringfg{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)}
.ring .rt{position:absolute;text-align:center;line-height:1.1}
.ring .rt b{font-family:var(--serif);font-size:24px;font-weight:600;display:block}
.ring .rt span{font-size:10.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:14px}
.row.sp{justify-content:space-between}
.grow1{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:860px){.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.cols>.card{margin-bottom:0}.cols+.card,.cols{margin-bottom:18px}}

/* ---------- Forms & buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--p2),var(--k2));color:#fff}
.btn.soft{background:var(--soft);color:var(--deep)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:#b4445f}
.btn.sm{padding:7px 14px;font-size:12.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:block;margin-bottom:15px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],textarea,select{
  width:100%;padding:12px 15px;border-radius:16px;border:1px solid var(--line);background:var(--bg);outline:none;transition:border .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--p2);box-shadow:0 0 0 4px rgba(179,157,219,.18)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
.inline-add{display:flex;gap:8px;margin-top:10px}
.inline-add input{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--p1),var(--k1));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--p2);box-shadow:0 4px 12px rgba(91,63,140,.3);cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--p2);cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin:8px 2px 0}
.advice{margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--soft);font-size:13.5px;color:var(--ink)}
.bigval{font-family:var(--serif);font-size:44px;font-weight:500;line-height:1;color:var(--deep)}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:4px;gap:2px;margin-bottom:18px;overflow-x:auto}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:9px 14px;border-radius:99px;font-size:13px;color:var(--muted);white-space:nowrap;transition:.25s}
.seg button.on{background:var(--card);color:var(--deep);font-weight:500;box-shadow:0 2px 10px rgba(91,63,140,.14)}
.check-row{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-bottom:12px}
.check-row input{width:18px;height:18px;accent-color:var(--p2)}

/* ---------- Tasks / lists ---------- */
.chk{width:27px;height:27px;border-radius:50%;border:1.6px solid var(--p2);display:grid;place-items:center;flex:none;color:transparent;transition:all .25s;background:transparent}
.chk.on{background:linear-gradient(135deg,var(--p2),var(--k2));border-color:transparent;color:#fff}
.chk.pop{animation:pop .35s}
/* re-renders after small actions skip entrance animations to stay calm */
.noanim .enter{animation:none}
.noanim .chart .draw path.ln{animation:none;stroke-dashoffset:0}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.trow{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px dashed var(--line)}
.trow:last-child{border-bottom:0}
.trow .tmain{flex:1;min-width:0;cursor:pointer}
.ttl{font-size:15px;line-height:1.35}
.trow.done .ttl{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.tag{font-size:11px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.tag.pk{background:var(--k1);color:#7a3355}.tag.pu{background:#E6DCF5;color:#4b3375}
.tag.mn{background:var(--mint);color:#2f5a49}.tag.sk{background:var(--sky);color:#2f4d68}.tag.pc{background:var(--peach);color:#7a4a2c}
.tag.soft{background:var(--soft);color:var(--muted)}
.due{font-size:11.5px;color:var(--muted)}.due.late{color:#b4445f}
.top{display:flex;align-items:center;gap:14px;padding:9px 0}
.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:18px;font-weight:600;flex:none;color:#4b3375}
.top:nth-child(1) .num{background:var(--p1)}.top:nth-child(2) .num{background:var(--k1)}.top:nth-child(3) .num{background:var(--sky)}
.top input{border:0;border-bottom:1.5px dashed var(--faint);border-radius:0;background:transparent;padding:9px 2px;box-shadow:none}
.top input:focus{border-bottom-color:var(--p2);box-shadow:none}
.top.done input{text-decoration:line-through;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.day{flex:1;min-width:48px;padding:10px 4px;border-radius:18px;text-align:center;border:1px solid var(--line);font-size:11px;color:var(--muted);transition:.2s}
.day b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:500}
.day.on{background:var(--p1);border-color:var(--p1);color:#2b1d44}.day.on b{color:#2b1d44}
.day i{display:block;height:5px;width:5px;border-radius:50%;background:var(--k2);margin:4px auto 0}
.day i.none{background:transparent}
.tdisp{font-family:var(--serif);font-size:58px;font-weight:500;line-height:1;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.pcard{padding:16px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.pcard:last-child{border-bottom:0}
.pcard h4{font-family:var(--serif);font-weight:600;font-size:19px;margin-bottom:3px}
.pcard p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Mood / habits ---------- */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{padding:14px 4px 10px;border-radius:20px;text-align:center;font-size:12px;color:#3b3347;border:2px solid transparent;transition:.2s}
.mood i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 7px;background:rgba(255,255,255,.7)}
.mood.on{border-color:var(--deep);transform:translateY(-2px)}
.dots{display:flex;gap:6px}
.dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-size:10px;color:var(--muted);display:grid;place-items:center;transition:.2s}
.dot.on{background:var(--p2);border-color:var(--p2);color:#fff}
.dot.today{border-color:var(--p2)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:12px;padding:7px 13px;border-radius:99px;background:linear-gradient(135deg,#FFF1D6,#FBE1EC);color:#6b4a2a}
.badge.off{background:var(--soft);color:var(--faint)}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--sans)}
.chart .draw path.ln{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- Nav / FAB ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(calc(100% - 24px),560px);
  background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:30px;padding:8px 6px;
  display:flex;box-shadow:0 14px 40px -14px rgba(91,63,140,.35),0 0 0 1px var(--line);z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:10.5px;color:var(--muted);border-radius:22px;transition:.25s;position:relative}
.nav button.on{color:var(--deep);font-weight:500}
.nav button.on::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--p2)}
.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:96px;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--p2),var(--k2));color:#fff;display:grid;place-items:center;z-index:29;
  box-shadow:0 14px 28px -8px rgba(179,157,219,.9);transition:transform .25s}
.fab:active{transform:scale(.92) rotate(45deg)}

/* ---------- Sheets / overlays ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(28,27,31,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,640px);max-height:92vh;overflow:auto;
  background:var(--card);border-radius:30px 30px 0 0;padding:10px 22px 34px;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.open .sheet{transform:translate(-50%,0)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet .sh h2{font-family:var(--serif);font-size:27px;font-weight:500}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{padding:18px 14px;border-radius:20px;background:var(--soft);text-align:left;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--deep);transition:.2s}
.qbtn:active{transform:scale(.97)}
.opt{padding:14px 16px;border-radius:18px;border:1.5px solid var(--line);text-align:left;width:100%;transition:.2s;margin-bottom:8px;font-size:14px}
.opt.on{border-color:var(--p2);background:var(--soft);color:var(--deep);font-weight:500}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--p2),var(--k2))}
.tip{padding:14px 16px;border-radius:18px;background:var(--soft);font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.tip b{color:var(--deep);font-weight:600}
.overlay{position:fixed;inset:0;z-index:70;background:linear-gradient(160deg,#1C1B1F,#3A2F45);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;text-align:center;padding:28px;opacity:0;transition:opacity .6s}
.overlay.on{opacity:1}
.overlay h2{font-family:var(--serif);font-size:38px;font-weight:500}
.overlay p{color:#D3C9DF;max-width:340px}
.orb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--k1),var(--p2));box-shadow:0 0 90px rgba(201,182,228,.55);transform:scale(.78)}
.big-step{font-family:var(--serif);font-size:96px;line-height:1;color:var(--k1)}
.xtop{position:absolute;top:22px;right:22px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;
  font-size:13px;opacity:0;pointer-events:none;transition:.4s;z-index:80;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-14px;width:8px;height:13px;border-radius:2px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(540deg);opacity:.9}}

/* ---------- Splash / onboarding ---------- */
.splash{position:fixed;inset:0;z-index:95;background:linear-gradient(160deg,#FBF8FC,#F6E6F0 60%,#E6DCF5);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;text-align:center;transition:opacity .9s;color:#1C1B1F}
[data-theme=dark] .splash{background:linear-gradient(160deg,#17151B,#2A2233);color:#F1ECF6}
.splash.out{opacity:0;pointer-events:none}
.splash h1{font-family:var(--serif);font-size:54px;font-weight:500;letter-spacing:.01em;animation:enter 1.2s both}
.splash p{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--muted);animation:enter 1.6s .3s both}
.splash .gold-line{width:84px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:enter 1.4s .15s both}
.onboard{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:24px}
.onboard .box{width:min(100%,420px);text-align:center}
.onboard h1{font-family:var(--serif);font-weight:500;font-size:44px}
.onboard .tg{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);margin:4px 0 28px}
.onboard .avatar{margin:0 auto 20px;width:72px;height:72px;font-size:30px}
.onboard .field{text-align:left}
.hide{display:none!important}
/* money */
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:#2f7a5c}[data-theme=dark] .amt.in{color:#7fcfa9}
.trow .amt{flex:none;padding-top:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app" class="app"><div id="view"></div></div>
<nav class="nav hide" id="nav" aria-label="Main"></nav>
<button class="fab hide" id="fab" data-a="quick" aria-label="Quick actions"></button>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="overlayRoot"></div>

function load(){

function save(){

/* ---------- Derived data ---------- */
function activityDates(){
  const s=new Set();
  S.tasks.forEach(t=>t.done&&t.doneAt&&s.add(t.doneAt));
  S.habits.forEach(h=>Object.keys(h.log||{}).forEach(d=>h.log[d]&&s.add(d)));
  S.journal.forEach(j=>s.add(j.date));S.moods.forEach(m=>s.add(m.date));S.focus.forEach(f=>s.add(f.date));
  S.resets.forEach(r=>s.add(r.date));S.money.entries.forEach(e=>s.add(e.date));S.books.forEach(b=>(b.log||[]).forEach(l=>s.add(l.date)));
  return s;
}
function streakOf(has){let d=new Date();if(!has(ds(d)))d=addDays(d,-1);let n=0;while(has(ds(d))){n++;d=addDays(d,-1)}return n}
const streak=()=>{const a=activityDates();return streakOf(d=>a.has(d))};
const habitStreak=h=>streakOf(d=>h.log&&h.log[d]);
function goalPct(g){if(g.milestones.length)return Math.round(g.milestones.filter(m=>m.done).length/g.milestones.length*100);return g.progress||0}
function todayTasksStat(){
  const t=ds();const done=S.tasks.filter(x=>x.done&&x.doneAt===t).length;
  const open=S.tasks.filter(x=>!x.done&&x.due&&x.due<=t).length;
  return {done,total:done+open,pct:(done+open)?done/(done+open)*100:0};
}
function nextDeadline(){
  const t=ds();return S.tasks.filter(x=>!x.done&&x.due&&x.due>=t).sort((a,b)=>a.due.localeCompare(b.due))[0];
}
function dueLabel(d){
  const n=diffDays(d);
  if(n<0)return `Overdue · ${-n}d`;if(n===0)return 'Today';if(n===1)return 'Tomorrow';
  return n<7?wd(fromDs(d)):fmtShort(d);
}
function dailyQuote(){
  const q=S.quotes;if(!q.length)return null;
  const day=Math.floor((fromDs(ds())-new Date(new Date().getFullYear(),0,0))/864e5);
  return q[day%q.length];
}
function energyInfo(v){
  if(v<=2)return['Low','A very low day. Choose one tiny priority, protect your breaks, and be kind to yourself.'];
  if(v<=4)return['Gentle','Gentle day. One small priority and a proper break.'];
  if(v<=6)return['Steady','Steady day. Two or three priorities, with short pauses between them.'];
  if(v<=8)return['Strong','Good energy. A lovely window for deep work, and still take your breaks.'];
  return['Bright','High energy. Spend it on what matters most, and don’t borrow from tomorrow.'];
}
function badges(){

}

// Animated progress ring (SVG). Values animate in after render via animateIn().
function ring(pct,size=96,main='',sub='',w=9,c1='#B39DDB',c2='#F4B6C9'){
  const r=(size-w)/2,C=2*Math.PI*r,id='g'+uid(),to=C*(1-clamp(pct,0,100)/100);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="${w}"/>
    <circle class="ringfg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${w}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${ui.anim?C:to}" data-to="${to}"/></svg>
    <div class="rt"><b>${main}</b><span>${sub}</span></div></div>`;
}
const bar=pct=>`<div class="bar"><i style="width:${ui.anim?0:clamp(pct,0,100)}%" data-w="${clamp(pct,0,100)}"></i></div>`;
function animateIn(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $$('.ringfg').forEach(e=>e.style.strokeDashoffset=e.dataset.to);
    $$('.bar i[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');
  }));
}

// Smooth line chart. series:[{name,color,vals:[n|null]}]. labels: x axis text.
function lineChart(series,labels,{h=150,min=1,max=5}={}){
  const W=320,L=22,R=8,T=10,B=22,n=labels.length;if(!n)return '';
  const x=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)),y=v=>T+(1-(v-min)/(max-min))*(h-T-B);
  let g='';for(let v=min;v<=max;v+=(max-min>5?2:1))g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${L-7}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const step=n>9?Math.ceil(n/6):1;
  const xl=labels.map((l,i)=>i%step===0?`<text x="${x(i)}" y="${h-5}" text-anchor="middle">${esc(l)}</text>`:'').join('');
  const paths=series.map(s=>{
    const pts=s.vals.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    if(!pts.length)return '';
    let d=`M${pts[0][0]},${pts[0][1]}`;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
      d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;
    }
    const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="var(--card)" stroke="${s.color}" stroke-width="2"/>`).join('');
    return `<path class="ln" d="${d}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linecap="round" pathLength="1000"/>${dots}`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Line chart">${g}${xl}<g class="draw">${paths}</g></svg>`;
}

// Returns a clean https Spotify URL, '' for empty input, or null when the link isn't a Spotify link.
function cleanSpotify(u){
  u=(u||'').trim();if(!u)return '';
  const m=u.match(/^spotify:(track|album|playlist|artist|episode|show):([A-Za-z0-9]+)$/);
  if(m)return `https://open.spotify.com/${m[1]}/${m[2]}`;
  if(!/^[a-z]+:/i.test(u))u='https://'+u;
  try{const x=new URL(u);if(x.protocol==='https:'&&/^(open\.spotify\.com|spotify\.link|spotify\.app\.link)$/.test(x.hostname))return x.href}catch(_){}
  return null;
}

function rangeDays(r){const t=new Date();if(r==='today')return[ds(t)];if(r==='week')return dayRange(weekStart(t),t);return dayRange(new Date(t.getFullYear(),t.getMonth(),1),t)}
function stats(days){
  const set=new Set(days),done=S.tasks.filter(t=>t.done&&set.has(t.doneAt)).length,open=S.tasks.filter(t=>!t.done&&t.due&&set.has(t.due)).length;
  const hab=S.habits.map(h=>({name:h.name,n:days.filter(d=>h.log[d]).length,streak:habitStreak(h)}));
  return {done,total:done+open,hab,checkins:sum(hab.map(h=>h.n)),focus:sum(S.focus.filter(f=>set.has(f.date)).map(f=>f.min)),
    pages:sum(S.books.flatMap(b=>(b.log||[]).filter(l=>set.has(l.date)).map(l=>l.pages))),
    journals:S.journal.filter(j=>set.has(j.date)).length,notes:S.notes.filter(n=>set.has(n.created)).length,resets:S.resets.filter(r=>set.has(r.date)).length,
    mIn:sum(S.money.entries.filter(e=>e.type==='in'&&set.has(e.date)).map(e=>e.amt)),mOut:sum(S.money.entries.filter(e=>e.type==='out'&&set.has(e.date)).map(e=>e.amt))};
}
function insights(){
  const wk=stats(dayRange(weekStart(new Date()),new Date())),out=[];
  const best=wk.hab.slice().sort((a,b)=>b.n-a.n)[0];
  if(best&&best.n>=2)out.push(`You were most consistent with ${best.name.toLowerCase()} this week. Well done.`);
  if(wk.done)out.push(`You completed ${wk.done} task${wk.done===1?'':'s'} this week. Steady progress, even on the heavy days.`);
  if(wk.focus>=25)out.push(`You gave ${wk.focus} minutes of deep focus this week. That’s real, quiet work.`);
  if(wk.journals)out.push('You made space to write this week. Listening to yourself matters.');
  if(wk.resets)out.push('You paused for a reset when you needed one. That is a skill, not a luxury.');
  if(!out.length)out.push('Every small step counts. Begin wherever you are, and let it be enough.');
  return out.slice(0,3);

function wizCapture(){
  const w=ui.wiz,d=w.d;

}
function wizRender(){
  const w=ui.wiz,d=w.d,s=w.step;let body='',ok=true;
  if(s===1){body=`<p class="sub" style="margin-bottom:14px">Where would you like to grow?</p>${GOAL_CATS.map(c=>`<button class="opt ${d.cat===c?'on':''}" data-a="wiz-cat" data-k="${esc(c)}">${c}</button>`).join('')}`;ok=!!d.cat}
  if(s===2)body=`<p class="sub" style="margin-bottom:12px">Your “why” is what carries you on slow days.</p>${fld('Why does this matter to me?',`<textarea id="w_why" placeholder="Because…">${esc(d.why)}</textarea>`)}`;
  if(s===3){body=`<div class="tip"><b>SMART, gently:</b> Specific · Measurable · Achievable · Relevant · Time-bound. A goal you can picture finishing is easier to begin.</div>
    ${fld('Goal name',inp('w_title',d.title,'e.g. Read 12 books this year'))}${fld('Measurable target',inp('w_target',d.target,'e.g. 12 books finished'))}${fld('Deadline',inp('w_deadline',d.deadline,'','date'))}`;ok=!!(d.title&&d.target)}
  if(s===4)body=`<p class="sub" style="margin-bottom:12px">Break it into small steps. Turn any of them into a task.</p>
    ${d.ms.map(m=>`<div class="trow"><div class="tmain" style="cursor:default"><div class="ttl">${esc(m.text)}</div></div>
      <button class="chip ${m.toTask?'on':''}" data-a="wiz-mtask" data-id="${m.id}">→ Task</button><button class="xbtn" data-a="wiz-mdel" data-id="${m.id}" aria-label="Remove">${icon('x',14,2)}</button></div>`).join('')}
    <div class="inline-add"><input type="text" id="w_ms" placeholder="Add a small step"><button class="btn soft sm" data-a="wiz-madd">Add</button></div>
    <div style="margin-top:18px">${fld('A tiny habit that supports this (optional)',inp('w_habit',d.habit,'e.g. Read 15 minutes'))}<label class="check-row"><input type="checkbox" id="w_mkh" ${d.makeHabit?'checked':''}>Create this as a daily habit</label></div>`;
  if(s===5)body=`<div class="card gold" style="box-shadow:none;margin:0 0 14px"><span class="eyebrow">${esc(d.cat)}</span><h2>${esc(d.title)}</h2><p class="sub">Target · ${esc(d.target)}${d.deadline?` · by ${fmtShort(d.deadline)}`:''}</p>
     ${d.why?`<p class="quote" style="font-size:19px;margin-top:10px">“${esc(d.why)}”</p>`:''}</div>
     <p class="sub">${d.ms.length} milestone${d.ms.length===1?'':'s'}${d.ms.filter(m=>m.toTask).length?` · ${d.ms.filter(m=>m.toTask).length} will become tasks`:''}${d.makeHabit&&d.habit?` · habit “${esc(d.habit)}” will be added`:''}</p>`;
  openSheet('New goal',`<div class="steps">${[1,2,3,4,5].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>${body}
    <div class="row sp" style="margin-top:20px">${s>1?`<button class="btn ghost" data-a="wiz-back">Back</button>`:'<span></span>'}
    ${s<5?`<button class="btn pri" data-a="wiz-next">Continue</button>`:`<button class="btn pri" data-a="wiz-save">Save goal</button>`}</div>`);
}
function wizSave(){
  const d=ui.wiz.d;

  const set=(t,s,sc,dur)=>{const o=$('#orb'),a=$('#bt'),b=$('#bs');if(!o)return;a.textContent=t;b.textContent=s;o.style.transition=`transform ${dur}s ease-in-out`;o.style.transform=`scale(${sc})`};

/* ---------- Focus timer engine ---------- */
ui.timer={len:25,mode:'focus',left:25*60,running:false,end:0};
function timerTick(){
  const T=ui.timer;if(!T.running)return;
  T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  const d=$('#tdisp');if(d)d.textContent=`${pad(Math.floor(T.left/60))}:${pad(T.left%60)}`;
  if(T.left<=0){
    T.running=false;
    if(T.mode==='focus'){S.focus.push({date:ds(),min:T.len});save();T.mode='break';T.left=5*60;toast('Lovely focus. Time for a gentle break.')}
    else{T.mode='focus';T.left=T.len*60;toast('Break complete. Ready when you are.')}
    refreshTimer();
  }
}
function refreshTimer(){const e=$('#timerCard');if(e)e.outerHTML=timerCard()}

/* ---------- 7. Events ---------- */
function render(anim=false){
  const y=window.scrollY;ui.anim=anim;
  const v=$('#view');v.className=anim?'':'noanim';
  v.innerHTML=({today:pageToday,plan:pagePlan,heal:pageHeal,grow:pageGrow,week:pageWeek,me:pageMe})[ui.page]();
  $('#nav').innerHTML=[['today','Today'],['plan','Plan'],['heal','Heal'],['grow','Grow'],['week','Week']].map(([k,l])=>`<button class="${ui.page===k?'on':''}" data-a="go" data-p="${k}">${icon(k,23,1.4)}${l}</button>`).join('');
  $('#fab').innerHTML=icon('plus',24,2);
  animateIn();
  if(!anim)window.scrollTo(0,y);
  if(ui.fresh){const e=document.querySelector(`.chk[data-id="${ui.fresh}"]`);e&&e.classList.add('pop');ui.fresh=null}
}
function go(p){closeSheet();ui.page=p;render(true);window.scrollTo(0,0)}
const re=()=>render(false);

function syncTopFromTask(t){Object.values(S.top).forEach(a=>a.forEach(x=>{if(x.taskId===t.id)x.done=t.done}))}
function checkChallenges(){
  S.challenges.filter(c=>!c.done).forEach(c=>{if(challengeCount(c)>=c.days){c.done=true;c.doneAt=ds();confetti();toast(`${c.days}-day challenge complete. Beautifully done.`)}});
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id,k=el.dataset.k;
  if(el.tagName==='INPUT'||el.tagName==='TEXTAREA')return;
  switch(a){
  /* navigation */
  case 'go':go(el.dataset.p);break;
  case 'quick':sheetQuick();break;
  case 'sheet-close':closeSheet();break;
  case 'ov-close':overlayClose();break;
  case 'plan-seg':ui.plan=k;render(true);break;
  case 'grow-seg':ui.grow=k;render(true);break;
  case 'range':ui.range=k;render(true);break;
  /* quick actions */
  case 'q-task':sheetTask();break;
  case 'q-note':sheetNote();break;
  case 'q-dump':closeSheet();ui.page='plan';ui.plan='dump';render(true);break;
  case 'q-reset':startBreathing();break;
  case 'q-ground':startGrounding();break;
  case 'q-mood':sheetMood();break;
  case 'q-journal':go('heal');break;
  case 'edit-schedule':sheetSchedule();break;
  /* tasks */
  case 'task-toggle':{const t=S.tasks.find(x=>x.id===id);t.done=!t.done;t.doneAt=t.done?ds():null;syncTopFromTask(t);save();ui.fresh=id;if(t.done)toast('Done. That counts.');re();break}
  case 'task-edit':sheetTask(id);break;
  case 'task-save':{
    const title=val('f_title');if(!title){toast('Give the task a name');return}
    const o={title,cat:val('f_cat'),prio:val('f_prio'),due:val('f_due'),type:val('f_type')};
    if(ui.edit.id)Object.assign(S.tasks.find(x=>x.id===ui.edit.id),o);else S.tasks.push({id:uid(),done:false,doneAt:null,created:ds(),...o});
    if(ui.edit.dump)S.dumps=S.dumps.filter(d=>d.id!==ui.edit.dump);
    save();closeSheet();re();break}
  case 'task-del':S.tasks=S.tasks.filter(x=>x.id!==ui.edit.id);save();closeSheet();re();break;
  case 'task-top':{const t=S.tasks.find(x=>x.id===ui.edit.id),slot=getTop().find(x=>!x.text);
    if(!slot){toast('Your top 3 is full. Maybe that’s plenty.');return}slot.text=t.title;slot.taskId=t.id;slot.done=t.done;save();closeSheet();toast('Added to today’s priorities');if(ui.page==='today')re();break}
  case 'tfilter':ui.taskFilter=k;re();break;
  case 'day-pick':ui.selDay=ui.selDay===el.dataset.d?null:el.dataset.d;re();break;
  case 'day-clear':ui.selDay=null;re();break;
  case 'toggle-done':ui.showDone=!ui.showDone;re();break;
  case 'timer-go':{const T=ui.timer;if(T.running){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));T.running=false}else{T.running=true;T.end=Date.now()+T.left*1000}refreshTimer();break}
  case 'timer-reset':{const T=ui.timer;T.running=false;T.mode='focus';T.left=T.len*60;refreshTimer();break}
  case 'timer-len':{const T=ui.timer;T.len=+el.dataset.n;T.running=false;T.mode='focus';T.left=T.len*60;refreshTimer();break}
  /* today: top 3 */
  case 'top-toggle':{const x=getTop().find(z=>z.id===id);if(!x.text){toast('Write a priority first');return}x.done=!x.done;
    if(x.taskId){const t=S.tasks.find(z=>z.id===x.taskId);if(t){t.done=x.done;t.doneAt=x.done?ds():null}}
    save();ui.fresh=id;const all=getTop().every(z=>z.done&&z.text);if(x.done&&all){confetti(30);toast('All three done. Lovely.')}re();break}
  /* notes & dump */
  case 'note-edit':sheetNote(id);break;
  case 'note-save':{const title=val('f_title');if(!title){toast('Give the note a title');return}
    const o={title,body:val('f_body'),tags:val('f_tags').split(',').map(t=>t.trim().replace(/^#/,'').toLowerCase()).filter(Boolean),pinned:$('#f_pin').checked};
    if(ui.edit.id)Object.assign(S.notes.find(x=>x.id===ui.edit.id),o);else S.notes.push({id:uid(),created:ds(),...o});
    save();closeSheet();re();break}
  case 'note-del':S.notes=S.notes.filter(x=>x.id!==ui.edit.id);save();closeSheet();re();break;
  case 'ntag':ui.noteTag=ui.noteTag===k?'':k;re();break;
  case 'dump-add':{const t=val('dumpText');if(!t){toast('Write whatever is on your mind');return}
    t.split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>S.dumps.unshift({id:uid(),text:s,created:ds()}));save();toast('Let go.');re();break}
  case 'dump-task':{const d=S.dumps.find(x=>x.id===id);sheetTask(null,{title:d.text,dump:id});break}
  case 'dump-del':S.dumps=S.dumps.filter(x=>x.id!==id);save();re();break;
  /* heal */
  case 'mood-set':{const v=+el.dataset.v,m=S.moods.find(x=>x.date===ds());if(m)m.v=v;else S.moods.push({date:ds(),v,note:''});save();toast('Noted. Thank you for checking in.');re();break}
  case 'mood-pick':ui.moodSel=+el.dataset.v;$$('.mood',$('#sheet')).forEach(b=>b.classList.toggle('on',+b.dataset.v===ui.moodSel));break;
  case 'mood-save':{if(!ui.moodSel){toast('Choose how you feel');return}const note=val('f_note'),m=S.moods.find(x=>x.date===ds());
    if(m){m.v=ui.moodSel;m.note=note}else S.moods.push({date:ds(),v:ui.moodSel,note});save();closeSheet();toast('Noted. Thank you for checking in.');re();break}
  case 'shuffle-prompts':{ui.draft=ui.draft||{};const rest=PROMPT_POOL.slice().sort(()=>Math.random()-.5).slice(0,3);ui.prompts=rest;re();break}
  case 'journal-save':{const ans={};ui.prompts.forEach(p=>{const v=(ui.draft||{})[p];if(v&&v.trim())ans[p]=v.trim()});
    if(!Object.keys(ans).length){toast('Write a few words first');return}
    S.journal.push({id:uid(),date:ds(),answers:ans});ui.draft={};save();toast('Saved. Thank you for listening to yourself.');re();break}
  case 'journal-view':sheetJournal(id);break;
  case 'journal-del':if(confirm('Delete this entry?')){S.journal=S.journal.filter(x=>x.id!==id);save();closeSheet();re()}break;
  case 'ground-next':startGrounding(+el.dataset.i);break;
  /* schedule */
  case 'srow-add':$('#schRows').insertAdjacentHTML('beforeend',schRow({label:'',start:'09:00',end:'10:00'}));break;
  case 'srow-del':el.closest('.srow').remove();break;
  case 'sch-save':{const rows=$$('.srow').map(r=>({id:uid(),label:$('.sl',r).value.trim(),start:$('.ss',r).value,end:$('.se',r).value})).filter(r=>r.label&&r.start&&r.end&&toMin(r.start)<toMin(r.end));
    S.schedule=rows;save();closeSheet();re();break}
  /* goals */
  case 'wiz-new':wizOpen();break;
  case 'wiz-tpl':wizOpen(TEMPLATES[+el.dataset.i]);break;
  case 'wiz-cat':ui.wiz.d.cat=k;wizRender();break;
  case 'wiz-next':{wizCapture();const d=ui.wiz.d,s=ui.wiz.step;
    if(s===1&&!d.cat){toast('Choose a category to continue');return}
    if(s===3&&(!d.title||!d.target)){toast('Add a goal name and a measurable target');return}
    ui.wiz.step++;wizRender();break}
  case 'wiz-back':wizCapture();ui.wiz.step--;wizRender();break;
  case 'wiz-madd':{const t=val('w_ms');if(!t)return;wizCapture();ui.wiz.d.ms.push({id:uid(),text:t,toTask:false});wizRender();break}
  case 'wiz-mdel':wizCapture();ui.wiz.d.ms=ui.wiz.d.ms.filter(m=>m.id!==id);wizRender();break;
  case 'wiz-mtask':{wizCapture();const m=ui.wiz.d.ms.find(x=>x.id===id);m.toTask=!m.toTask;wizRender();break}
  case 'wiz-save':wizSave();break;
  case 'goal-open':sheetGoal(id);break;
  case 'ms-toggle':{const g=S.goals.find(x=>x.id===ui.edit.id),m=g.milestones.find(x=>x.id===id);m.done=!m.done;save();sheetGoal(g.id);re();break}
  case 'ms-task':{const g=S.goals.find(x=>x.id===ui.edit.id),m=g.milestones.find(x=>x.id===id);S.tasks.push({id:uid(),title:m.text,cat:'Personal',prio:'later',due:'',type:'',done:false,doneAt:null,created:ds()});save();toast('Added to your tasks');break}
  case 'gnote-add':{const t=val('f_jn');if(!t)return;const g=S.goals.find(x=>x.id===ui.edit.id);(g.notes=g.notes||[]).push({date:ds(),text:t});save();sheetGoal(g.id);break}
  case 'goal-celebrate':{const g=S.goals.find(x=>x.id===ui.edit.id);g.celebrated=true;g.milestones.forEach(m=>m.done=true);save();closeSheet();confetti(70);toast('You did this. Take a moment to feel it.');re();break}
  case 'goal-del':if(confirm('Delete this goal?')){S.goals=S.goals.filter(x=>x.id!==ui.edit.id);save();closeSheet();re()}break;
  /* habits */
  case 'habit-new':sheetHabit();break;
  case 'habit-save':{const n=val('f_name');if(!n){toast('Name your habit');return}S.habits.push({id:uid(),name:n,log:{}});save();closeSheet();re();break}
  case 'habit-day':{const h=S.habits.find(x=>x.id===id),d=el.dataset.d;if(h.log[d])delete h.log[d];else h.log[d]=true;save();checkChallenges();save();re();break}
  case 'habit-del':if(confirm('Remove this habit?')){S.habits=S.habits.filter(x=>x.id!==id);S.challenges=S.challenges.filter(c=>c.habitId!==id);save();re()}break;
  case 'chal-new':sheetChallenge(id);break;
  case 'chal-start':{S.challenges.push({id:uid(),habitId:ui.edit.id,days:+el.dataset.n,start:ds(),done:false});save();closeSheet();toast('Challenge begun. Be kind to yourself along the way.');re();break}
  /* reading / music */
  case 'book-new':sheetBook();break;
  case 'book-open':sheetBook(id);break;
  case 'book-save':{
    const pages=+val('f_pages')||0,read=clamp(+val('f_read')||0,0,pages||1e5);
    if(ui.edit.id){const b=S.books.find(x=>x.id===ui.edit.id);const delta=read-b.read;if(delta>0)(b.log=b.log||[]).push({date:ds(),pages:delta});
      b.pages=pages;b.read=read;const q=val('f_quote');if(q)b.quotes.push(q);
      if(pages&&read>=pages&&!b.finished){b.finished=true;confetti(50);toast('Another book finished.')}}
    else{const title=val('f_title');if(!title){toast('Add a title');return}S.books.push({id:uid(),title,author:val('f_author'),pages,read,finished:false,quotes:[],log:read?[{date:ds(),pages:read}]:[]})}
    save();closeSheet();re();break}
  case 'book-del':if(confirm('Remove this book?')){S.books=S.books.filter(x=>x.id!==ui.edit.id);save();closeSheet();re()}break;
  case 'music-new':sheetMusic();break;
  case 'music-edit':sheetMusic(id);break;
  case 'music-del-sheet':S.music=S.music.filter(x=>x.id!==ui.edit.id);save();closeSheet();re();break;
  case 'music-save':{const t=val('f_title');if(!t){toast('Add a title');return}
    const url=cleanSpotify(val('f_url'));if(url===null){toast('Please paste a Spotify link (open.spotify.com…)');return}
    const o={title:t,artist:val('f_artist'),mood:val('f_mood'),url};
    if(ui.edit&&ui.edit.id)Object.assign(S.music.find(x=>x.id===ui.edit.id),o);else S.music.push({id:uid(),...o});
    save();closeSheet();re();break}
  case 'music-del':S.music=S.music.filter(x=>x.id!==id);save();re();break;
  case 'mmood':ui.musicMood=k;re();break;
  /* week */
  case 'review-save':{S.reviews[ds(weekStart(new Date()))]={date:ds(),a:[0,1,2].map(i=>val('rv'+i))};save();toast('Review saved. Well done for pausing to reflect.');re();break}
  /* money */
  case 'q-spent':closeSheet();ui.page='plan';ui.plan='money';render(true);sheetMoney(null,'out');break;
  case 'q-income':closeSheet();ui.page='plan';ui.plan='money';render(true);sheetMoney(null,'in');break;
  case 'm-new':sheetMoney(null,el.dataset.t);break;
  case 'm-edit':sheetMoney(id);break;
  case 'm-save':{const amt=parseFloat(val('f_amt'));if(!(amt>0)){toast('Enter an amount');return}
    const o={amt,cat:val('f_cat'),note:val('f_note'),date:val('f_date')||ds()};
    if(ui.edit.id)Object.assign(S.money.entries.find(x=>x.id===ui.edit.id),o);else S.money.entries.push({id:uid(),type:ui.edit.type,t:Date.now(),...o});
    ui.moneyDay=o.date>ds()?ds():o.date;save();closeSheet();re();break}
  case 'm-del':S.money.entries=S.money.entries.filter(x=>x.id!==ui.edit.id);save();closeSheet();re();break;
  case 'mday':{const n=addDays(fromDs(ui.moneyDay||ds()),+el.dataset.n);ui.moneyDay=ds(n)>ds()?ds():ds(n);re();break}
  case 'mtoday':ui.moneyDay=ds();re();break;
  case 'm-settings':sheetMoneySettings();break;
  case 'm-settings-save':S.money.cur=val('f_cur')||'IDR';S.money.limit=Math.max(0,parseFloat(val('f_limit'))||0);save();closeSheet();re();break;
  case 'm-csv':{const safe=c=>typeof c==='string'&&/^[=+\-@\t\r]/.test(c)?"'"+c:c;
    const rows=[['Date','Type','Category','Note','Amount']].concat(S.money.entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.type==='in'?'Income':'Spent',e.cat,e.note||'',e.amt]));
    const csv=rows.map(r=>r.map(c=>`"${String(safe(c)).replace(/"/g,'""')}"`).join(',')).join('\n');
    const b=new Blob(['﻿'+csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`resiliente-money-${ds()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('CSV downloaded');break}
  /* me */
  case 'reminder':showReminder();break;
  case 'qcat':ui.quoteCat=k;re();break;
  case 'quote-new':sheetQuote();break;
  case 'quote-edit':sheetQuote(id);break;
  case 'quote-fav':{const q=S.quotes.find(x=>x.id===id);q.fav=!q.fav;save();re();break}
  case 'quote-save':{const text=val('f_text');if(!text){toast('Add the words');return}const o={text,author:val('f_author')||'Unknown',cat:val('f_cat')};
    if(ui.edit.id)Object.assign(S.quotes.find(x=>x.id===ui.edit.id),o);else S.quotes.push({id:uid(),fav:false,custom:true,...o});save();closeSheet();re();break}
  case 'quote-del':S.quotes=S.quotes.filter(x=>x.id!==ui.edit.id);save();closeSheet();re();break;
  case 'identity-edit':sheetIdentity();break;
  case 'identity-save':S.identity={...S.identity,values:val('f_values').split(',').map(s=>s.trim()).filter(Boolean),vision:val('f_vision'),affirmations:val('f_aff').split('\n').map(s=>s.trim()).filter(Boolean)};save();closeSheet();re();break;
  case 'profile-edit':sheetProfile();break;
  case 'profile-save':{const n=val('f_name');if(!n)return;S.profile={name:n,initials:(val('f_ini')||n[0]).slice(0,2).toUpperCase()};save();closeSheet();re();break}
  case 'theme':S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save();re();break;
  case 'export':{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=`resiliente-backup-${ds()}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup downloaded');break}
  case 'import':$('#importFile').click();break;
  case 'clear-sample':if(confirm('Remove all sample data? Your own entries stay.')){clearSample();re();toast('Sample data cleared')}break;
  case 'erase':if(confirm('Erase everything on this device? This cannot be undone.')){try{localStorage.removeItem(KEY)}catch(_){}S=defaults();location.reload()}break;
  }
});
$('#sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();overlayClose()}});

/* input-type events (no full re-render, so typing is never interrupted) */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='energy'){const v=+t.value,[l,adv]=energyInfo(v);S.energy[ds()]={v};$('#evalue').textContent=v;$('#eadvice').textContent=adv;
    const c=$$('.chip')[2];if(c)c.innerHTML=`Energy <b>${v}/10</b> · ${l}`;clearTimeout(ui.saveT);ui.saveT=setTimeout(save,350)}
  if(t.id==='noteSearch'){ui.noteQ=t.value;let ns=S.notes.filter(n=>{const q=ui.noteQ.toLowerCase();return(!ui.noteTag||n.tags.includes(ui.noteTag))&&(!q||(n.title+' '+n.body+' '+n.tags.join(' ')).toLowerCase().includes(q))});
    ns.sort((a,b)=>(b.pinned-a.pinned)||b.created.localeCompare(a.created));$('#noteList').innerHTML=notesList(ns)}
  if(t.dataset.a==='jdraft'){ui.draft=ui.draft||{};ui.draft[ui.prompts[+t.dataset.i]]=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.a==='top-text'){const x=getTop().find(z=>z.id===t.dataset.id);if(x){x.text=t.value.trim();if(!x.text){x.done=false;delete x.taskId}save();const n=getTop().filter(z=>z.done&&z.text).length;const c=$('#topcount');if(c)c.textContent=n+'/3'}}
});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!Array.isArray(o.tasks)||!o.profile)throw 0;
    if(confirm('Replace the data on this device with this backup?')){S=Object.assign(defaults(),o);S.identity=Object.assign(defaults().identity,o.identity||{});save();document.documentElement.dataset.theme=S.theme||'light';render(true);toast('Backup restored')}}
    catch(_){toast('That file doesn’t look like a Résiliente backup')}e.target.value=''};
  r.readAsText(f);
});

/* ---------- 8. Init ---------- */
function onboard(){
  const b=$('#onboard');b.classList.remove('hide');
  b.innerHTML=`<div class="box enter"><div class="avatar" id="obAv" style="display:grid;place-items:center">R</div><h1>Résiliente</h1><p class="tg">Your cracks are part of your gold.</p>
    ${fld('What should I call you?',inp('ob_name','','Your name'))}${fld('Initials for your avatar',inp('ob_ini','','e.g. A'))}
    <label class="check-row"><input type="checkbox" id="ob_sample" checked>Start with a few sample entries (you can clear them anytime)</label>
    <button class="btn pri block" id="obGo" style="margin-top:8px">Begin</button><p class="sub" style="margin-top:16px">Private by design. Everything stays on this device.</p></div>`;
  const name=$('#ob_name'),ini=$('#ob_ini'),av=$('#obAv');let manual=false;
  ini.addEventListener('input',()=>{manual=true;av.textContent=ini.value.toUpperCase()||'R'});
  name.addEventListener('input',()=>{if(!manual){ini.value=(name.value.trim()[0]||'').toUpperCase();av.textContent=ini.value||'R'}});
  $('#obGo').addEventListener('click',()=>{
    const n=name.value.trim();if(!n){toast('Please tell me your name');name.focus();return}
    S.profile={name:n,initials:(ini.value.trim()||n[0]).slice(0,2).toUpperCase()};
    seedQuotes();S.schedule=defaultSchedule();if($('#ob_sample').checked)seedSample();
    save();b.classList.add('hide');$('#nav').classList.remove('hide');$('#fab').classList.remove('hide');render(true);
  });
}
function init(){
  load();
  document.documentElement.dataset.theme=S.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  setTimeout(()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),1000)},1700);
  if(S.profile){$('#nav').classList.remove('hide');$('#fab').classList.remove('hide');render(true)}else onboard();
  setInterval(timerTick,1000);
  // refresh the "Right now" card each minute
  setInterval(()=>{if(ui.page==='today'&&!$('#sheetBg.open')){const c=$('.card.dark');if(c){c.outerHTML=rightNowCard();animateIn()}}},60000);
}
init();
// Offline install support (only on http/https, never on file://)
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
